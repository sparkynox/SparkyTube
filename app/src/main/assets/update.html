<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Update</title>
<style>
:root{--font:system-ui,"Roboto","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
body[data-theme="dark"]{--bg:#0A0A0A;--surface:#141414;--raised:#1C1C1C;--text:#F5F5F5;--text2:#9A9A9A;--line:#262626;--accent:#FF3B3B;--accent2:#FF7A45;--on:#fff;--glow:rgba(255,59,59,.20);--track:#33333A;--ok:#4ADE80;--warn:#FBBF24}
body[data-theme="light"]{--bg:#F2F4F7;--surface:#FFFFFF;--raised:#E8EBF0;--text:#121214;--text2:#565B65;--line:#D6DAE1;--accent:#D92626;--accent2:#F0613A;--on:#fff;--glow:rgba(217,38,38,.16);--track:#CDD1D9;--ok:#15803D;--warn:#B45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font)}
svg{display:block}.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:10;padding:14px 16px 8px;background:linear-gradient(180deg,var(--bg) 75%,transparent)}
header::before{content:"";position:absolute;inset:0 0 -30px 0;background:radial-gradient(90% 120% at 8% 0%,var(--glow),transparent 62%);pointer-events:none;z-index:-1}
.top{display:flex;align-items:center;gap:6px}
.back{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.back:active{background:var(--raised)}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;color:var(--text2)}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--on)}
.dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:.7rem;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}
.tab.on .dot{background:#fff;color:var(--accent)}
main{padding:8px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;animation:rise .4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{display:flex;gap:14px;align-items:center}
.badge{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px var(--glow)}
.badge.ok{background:linear-gradient(135deg,#16A34A,#4ADE80)}
.badge .ico{width:26px;height:26px}
.big{font-weight:800;font-size:1.15rem;line-height:1.2}
.sub{color:var(--text2);font-size:.88rem;margin-top:2px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;margin-top:14px;padding:13px;border-radius:14px;font-weight:800;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px var(--glow)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--raised);color:var(--text);box-shadow:none}
.log{white-space:pre-wrap;color:var(--text2);font-size:.9rem;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;max-height:46vh;overflow:auto}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s linear}
.bar.ind i{width:35%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.row{display:flex;justify-content:space-between;color:var(--text2);font-size:.82rem;margin-top:6px}
.err{color:var(--accent);font-size:.9rem;margin-top:10px}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--raised);color:var(--text2);margin-right:6px}
.chip.update{color:var(--ok)}.chip.warning{color:var(--warn)}
.msg.unread{border-color:var(--accent)}
.msg .t{font-weight:700}.msg .b{margin-top:6px;white-space:pre-wrap}.msg .d{color:var(--text2);font-size:.78rem;margin-top:8px}
.empty{text-align:center;color:var(--text2);padding:40px 10px}
.hide{display:none}
</style>
</head>
<body data-theme="dark">
<header>
  <div class="top">
    <button class="back" id="back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Update</h1>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabUpdate">Update</button>
    <button class="tab" id="tabMsgs">Messages<span class="dot hide" id="dot"></span></button>
  </div>
</header>
<main>
  <div id="vUpdate"></div>
  <div id="vMsgs" class="hide"></div>
</main>

<script>
(function () {
  var bridge = window.SparkyUpdate || {
    // stand-in so the page also opens in a normal browser while editing
    isNight: function () { return matchMedia("(prefers-color-scheme: dark)").matches; },
    initialTab: function () { return "update"; },
    state: function () { return JSON.stringify({ currentName: "2.0", currentCode: 13, phase: "IDLE", checked: true, hasUpdate: true, error: "", downloaded: 0, total: 0, speed: 0,
      latest: { name: "2.1", code: 14, changelog: "- new stuff\n- fixes", date: "2026-10-10T00:00:00Z", size: 31457280, mandatory: false },
      messages: [{ id: 1, title: "Hello", body: "Test message", type: "info", link: "", date: "2026-10-10T00:00:00Z", unread: true }] }); },
    check: function () {}, update: function () {}, install: function () {}, markRead: function () {}, openUrl: function () {}, close: function () {}
  };
  document.body.setAttribute("data-theme", bridge.isNight() ? "dark" : "light");

  var tab = bridge.initialTab() === "messages" ? "messages" : "update";
  var vUpdate = document.getElementById("vUpdate"), vMsgs = document.getElementById("vMsgs");
  var tabU = document.getElementById("tabUpdate"), tabM = document.getElementById("tabMsgs"), dot = document.getElementById("dot");
  var last = "", S = null;

  function ico(path) { return '<svg class="ico" viewBox="0 0 24 24">' + path + '</svg>'; }
  var I = {
    down: ico('<path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/>'),
    check: ico('<path d="M5 12l5 5 9-10"/>'),
    warn: ico('<path d="M12 8v5m0 4h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>')
  };

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function mb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function day(iso) { try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return ""; } }

  function drawUpdate() {
    var s = S, h = "";
    var l = s.latest;
    if (s.phase === "CHECKING" && !l) {
      h = '<div class="card"><div class="hero"><div class="badge">' + I.down + '</div><div><div class="big">Checking for updates…</div><div class="sub">Version ' + esc(s.currentName) + '</div></div></div><div class="bar ind"><i></i></div></div>';
    } else if (s.hasUpdate && l) {
      h += '<div class="card"><div class="hero"><div class="badge">' + I.down + '</div><div><div class="big">Version ' + esc(l.name) + ' is available</div>' +
           '<div class="sub">You have ' + esc(s.currentName) + (l.date ? ' · ' + esc(day(l.date)) : '') + (l.size ? ' · ' + mb(l.size) : '') + '</div></div></div>';
      if (s.phase === "DOWNLOADING") {
        var pct = s.total > 0 ? Math.min(100, Math.floor(s.downloaded * 100 / s.total)) : -1;
        h += '<div class="bar' + (pct < 0 ? ' ind' : '') + '"><i style="width:' + (pct < 0 ? 35 : pct) + '%"></i></div>' +
             '<div class="row"><span>' + (pct >= 0 ? pct + '%' : 'Downloading…') + '</span><span>' + mb(s.downloaded) + (s.total ? ' / ' + mb(s.total) : '') + (s.speed > 0 ? ' · ' + mb(s.speed) + '/s' : '') + '</span></div>';
      } else if (s.phase === "READY") {
        h += '<button class="btn" id="act" data-a="install">Install</button>';
      } else {
        h += '<button class="btn" id="act" data-a="update">' + (s.phase === "ERROR" ? 'Try again' : 'Update') + '</button>';
      }
      if (s.error) h += '<div class="err">' + esc(s.error) + '</div>';
      if (l.changelog) h += '<div class="log">' + esc(l.changelog) + '</div>';
      h += '</div>';
    } else if (s.checked && l) {
      h = '<div class="card"><div class="hero"><div class="badge ok">' + I.check + '</div><div><div class="big">You\'re up to date</div><div class="sub">Version ' + esc(s.currentName) + ' (' + s.currentCode + ')</div></div></div>' +
          '<button class="btn ghost" id="act" data-a="check">Check again</button></div>';
    } else {
      h = '<div class="card"><div class="hero"><div class="badge">' + I.warn + '</div><div><div class="big">Couldn\'t check right now</div><div class="sub">Version ' + esc(s.currentName) + ' · the update server isn\'t reachable</div></div></div>' +
          '<button class="btn ghost" id="act" data-a="check">Try again</button></div>';
    }
    return h;
  }

  function drawMsgs() {
    var m = S.messages || [];
    if (!m.length) return '<div class="empty">No messages yet.</div>';
    return m.map(function (x) {
      return '<div class="card msg' + (x.unread ? ' unread' : '') + '"><div class="t"><span class="chip ' + esc(x.type) + '">' + esc(x.type) + '</span>' + esc(x.title) + '</div>' +
             '<div class="b">' + esc(x.body) + '</div>' +
             (x.link ? '<button class="btn ghost" data-link="' + esc(x.link) + '">Open link</button>' : '') +
             '<div class="d">' + esc(day(x.date)) + '</div></div>';
    }).join("");
  }

  function unread() { return (S.messages || []).filter(function (x) { return x.unread; }).length; }

  function render() {
    var u = unread();
    dot.textContent = u; dot.className = "dot" + (u > 0 ? "" : " hide");
    tabU.className = "tab" + (tab === "update" ? " on" : "");
    tabM.className = "tab" + (tab === "messages" ? " on" : "");
    vUpdate.className = tab === "update" ? "" : "hide";
    vMsgs.className = tab === "messages" ? "" : "hide";
    var hu = drawUpdate(), hm = drawMsgs();
    var sig = tab + "|" + hu + "|" + hm;
    if (sig === last) return;
    last = sig;
    vUpdate.innerHTML = hu; vMsgs.innerHTML = hm;
    if (tab === "messages" && u > 0) bridge.markRead();
  }

  function poll() {
    try { S = JSON.parse(bridge.state()); } catch (e) { return; }
    render();
  }

  tabU.onclick = function () { tab = "update"; last = ""; render(); };
  tabM.onclick = function () { tab = "messages"; last = ""; render(); };
  document.getElementById("back").onclick = function () { bridge.close(); };

  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-a]");
    if (a) {
      var act = a.getAttribute("data-a");
      if (act === "update") bridge.update(); else if (act === "install") bridge.install(); else bridge.check();
      setTimeout(poll, 150);
      return;
    }
    var l = e.target.closest("[data-link]");
    if (l) bridge.openUrl(l.getAttribute("data-link"));
  });

  poll();
  setInterval(poll, 700);
})();
</script>
</body>
</html>
