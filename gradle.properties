org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# faster builds: reuse task outputs between builds and run independent modules/tasks in parallel
org.gradle.caching=true
org.gradle.parallel=true


# InnerTubeX and its deps need compileSdk 37, AGP 8.13 only knows 36 but builds fine against 37
android.suppressUnsupportedCompileSdk=37
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
